syntax = "proto3";

option java_package = "com.game.proto";
option go_package = "/protoGen";


enum InnerProtoCode {
    INNER_INVALID = 0;
    INNER_SERVER_HAND_SHAKE_REQ = -1;
    INNER_SERVER_HAND_SHAKE_RES = -2;

    INNER_HEART_BEAT_REQ = -3;
    INNER_HEART_BEAT_RES = -4;

    INNER_PLAYER_DISCONNECT_REQ = -6;
    INNER_PLAYER_DISCONNECT_RES = -7;


    INNER_TO_GAME_LOGIN_REQ = -10;
    INNER_TO_GAME_LOGIN_RES = -11;

    INNER_ROUTE_TRANSFER = -20;

}

message InnerHead {
    int64 id = 1;
}

message InnerHeartBeatRequest {
    int64 time = 1;
}

message InnerHeartBeatResponse {
    int64 time = 2;
}

message InnerLoginRequest {
    int64 sid = 1; //sessionId
    int64 roleId = 2;
}

message InnerLoginResponse {
    int64 sid = 1; //sessionId
    int64 roleId = 2;
}

message InnerPlayerDisconnectRequest {
    int64 sid = 1;
    int64 roleId = 2;
}

message InnerPlayerDisconnectResponse {
    int64 sid = 1;
    int64 roleId = 2;
}



message InnerLoginWorldRequest {
    int64 roleId = 1;
    int64 gatewayServerUid = 2;
    int64 gameServerUid = 3;
    string name = 4;
    int64 sessionId = 5; // 网关id
}

message InnerLoginWorldResponse {
    int32 errorCode = 1;
    int64 unitId = 2;
}

message InnerLogoutNotify {
    int64 roleId = 1;
    int64 sessionId = 2;
}

message InnerLoginInitNotify {
    int64 roleId = 1;
}



message InnerServerHandShakeReq {
    string service_name = 1;
    string service_id = 2;
    int32 areaId = 3;
    int32 server_type = 4;
    int32 id = 5;
}

message InnerServerHandShakeRes {
    string service_name = 1;
    string service_id = 2;
    int32 areaId = 3;
}

message KickOutRequest {
    int64 roleId = 1;
    int64 sid = 2;
    int32 reason = 3;
}

message KickOutResponse {
    int32 reason = 1;
}

// game 之间经 router 中转的业务消息：router 原样转发 inner_msg_id + body
message InnerRouteTransfer {
    int64 player_id = 1;       // 目标 game 上的玩家/对象 id，用于路由定位
    string dest_service_id = 2; // 目标节点 service_id，空则按 player_id 哈希
    int32 inner_msg_id = 3;     // 被转发的原始消息 id
    bytes body = 4;             // 被转发的原始消息序列化体
}



